<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Music Player UI</title>
    <style>
        /* --------------------------------------
           Reset and Base Styles
        -------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* --------------------------------------
           Music Player Container
        -------------------------------------- */
        .player {
            background: #ffffff;
            color: #1f2937;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 20px;
            margin: 20px;
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Track Info */
        .player__track {
            text-align: center;
            margin-bottom: 20px;
        }

        .player__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .player__title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .player__artist {
            font-size: 1rem;
            color: #6b7280;
        }

        /* Progress Bar (Static) */
        .player__progress {
            margin-bottom: 20px;
        }

        .player__bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .player__bar::before {
            content: '';
            width: 60%;
            height: 100%;
            background: #3b82f6;
            position: absolute;
            left: 0;
            transition: width 0.3s ease;
        }

        .player__time {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 5px;
        }

        /* Controls */
        .player__controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .player__button {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .player__button:hover {
            background: #2563eb;
            transform: scale(1.1);
        }

        .player__button--small {
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (max-width: 600px) {
            .player {
                margin: 10px;
                padding: 15px;
            }

            .player__image {
                height: 150px;
            }

            .player__title {
                font-size: 1.3rem;
            }

            .player__artist {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Music Player -->
    <div class="player">
        <div class="player__track">
            <img src="https://via.placeholder.com/300x200" alt="Album Cover" class="player__image">
            <h2 class="player__title">Dreamscape</h2>
            <p class="player__artist">Aurora</p>
        </div>
        <div class="player__progress">
            <div class="player__bar"></div>
            <div class="player__time">
                <span>1:20</span>
                <span>3:45</span>
            </div>
        </div>
        <div class="player__controls">
            <button class="player__button player__button--small">⏮</button>
            <button class="player__button">▶</button>
            <button class="player__button player__button--small">⏭</button>
        </div>
    </div>
</body>
</html>
