<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Page UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">ShopTrend</a>
            <div class="flex space-x-6">
                <a href="#cart" class="text-gray-600 hover:text-pink-600 transition">Cart</a>
            </div>
        </nav>
    </header>

    <!-- Wishlist Section -->
    <section class="py-16">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Your Wishlist</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow-lg p-6 flex items-center space-x-4 animate-slide-up">
                    <img src="https://via.placeholder.com/100x100" alt="Sneakers" class="w-24 h-24 object-cover rounded-lg">
                    <div class="flex-1">
                        <h3 class="text-lg font-semibold">Premium Sneakers</h3>
                        <p class="text-gray-600">$120.00</p>
                        <button class="mt-2 bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">Add to Cart</button>
                    </div>
                    <button class="text-red-500 hover:text-red-600" aria-label="Remove from Wishlist">Remove</button>
                </div>
                <div class="bg-white rounded-lg shadow-lg p-6 flex items-center space-x-4 animate-slide-up">
                    <img src="https://via.placeholder.com/100x100" alt="Watch" class="w-24 h-24 object-cover rounded-lg">
                    <div class="flex-1">
                        <h3 class="text-lg font-semibold">Smart Watch</h3>
                        <p class="text-gray-600">$80.00</p>
                        <button class="mt-2 bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">Add to Cart</button>
                    </div>
                    <button class="text-red-500 hover:text-red-600" aria-label="Remove from Wishlist">Remove</button>
                </div>
            </div>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
