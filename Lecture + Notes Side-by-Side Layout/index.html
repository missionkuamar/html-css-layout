<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture + Notes Side-by-Side Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">LearnHub</a>
        </nav>
    </header>

    <!-- Lecture + Notes Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Lecture Video -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Lecture: HTML Basics</h2>
                <video controls class="w-full rounded-lg">
                    <source src="https://example.com/lecture.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>
            </div>
            <!-- Notes -->
            <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Notes</h2>
                <textarea class="w-full h-96 p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" placeholder="Take notes here..."></textarea>
                <button class="mt-2 bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700 w-full">Save Notes</button>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
