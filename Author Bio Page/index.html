<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Bio Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">BlogHub</a>
        </nav>
    </header>

    <!-- Author Bio Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <div class="flex flex-col items-center md:flex-row md:items-start md:space-x-6">
                <img src="https://via.placeholder.com/150" alt="Author" class="w-32 h-32 rounded-full mb-4 md:mb-0">
                <div class="text-center md:text-left">
                    <h1 class="text-2xl font-bold text-gray-800">Jane Doe</h1>
                    <p class="text-gray-600 mt-2">Tech Writer & Speaker</p>
                    <p class="text-gray-600 mt-2">Jane is a passionate writer covering AI, tech trends, and innovation. She has written over 100 articles and spoken at 20+ conferences.</p>
                    <div class="flex justify-center md:justify-start space-x-4 mt-4">
                        <a href="#" class="text-teal-600 hover:text-teal-700">Twitter</a>
                        <a href="#" class="text-teal-600 hover:text-teal-700">LinkedIn</a>
                    </div>
                </div>
            </div>
            <div class="mt-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Posts</h2>
                <div class="space-y-4">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="text-lg font-semibold text-gray-800">AI in 2025</h3>
                        <p class="text-gray-600">How AI is transforming industries.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
