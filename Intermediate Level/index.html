<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlify Solutions - Multi-Step Form</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Multi-Step Form Section -->
    <section class="form-container">
        <div class="container">
            <h2>Sign Up with Nexlify Solutions</h2>
            <p>Complete the form below to join our community.</p>
            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-step active" data-step="1">1. Personal Info</div>
                <div class="progress-step" data-step="2">2. Contact Details</div>
                <div class="progress-step" data-step="3">3. Confirmation</div>
            </div>
            <!-- Form -->
            <form id="multi-step-form">
                <!-- Step 1: Personal Info -->
                <div class="form-step active" data-step="1">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="next-button" data-next="2">Next</button>
                    </div>
                </div>
                <!-- Step 2: Contact Details -->
                <div class="form-step" data-step="2">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="prev-button" data-prev="1">Previous</button>
                        <button type="button" class="next-button" data-next="3">Next</button>
                    </div>
                </div>
                <!-- Step 3: Confirmation -->
                <div class="form-step" data-step="3">
                    <div class="form-group">
                        <p>Please review your information:</p>
                        <ul class="confirmation-details">
                            <li><strong>First Name:</strong> <span id="confirm-first-name"></span></li>
                            <li><strong>Last Name:</strong> <span id="confirm-last-name"></span></li>
                            <li><strong>Email:</strong> <span id="confirm-email"></span></li>
                            <li><strong>Phone:</strong> <span id="confirm-phone"></span></li>
                        </ul>
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="prev-button" data-prev="2">Previous</button>
                        <button type="submit" class="submit-button">Submit</button>
                    </div>
                </div>
            </form>
            <p class="error-message" id="error-message"></p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 Nexlify Solutions. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
