<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Landing Page UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">LearnHub</a>
        </nav>
    </header>

    <!-- Course Landing Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div class="animate-slide-up">
                <h1 class="text-4xl font-bold text-gray-800 mb-4">Master Web Development</h1>
                <p class="text-gray-600 mb-6">Learn HTML, CSS, and JavaScript from industry experts in this comprehensive course.</p>
                <button class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700">Enroll Now</button>
            </div>
            <div class="animate-slide-up">
                <img src="https://via.placeholder.com/600x400" alt="Course" class="w-full rounded-lg shadow-lg">
            </div>
        </div>
        <div class="mt-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">What You’ll Learn</h2>
            <ul class="list-disc pl-6 text-gray-600 space-y-2">
                <li>Build responsive websites with HTML and CSS</li>
                <li>Create dynamic applications with JavaScript</li>
                <li>Deploy projects to the web</li>
            </ul>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
