<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureApp - Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.nodes/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Forgot Password Section -->
    <section class="forgot-password-container">
        <div class="forgot-password-box">
            <h1>SecureApp</h1>
            <h2>Reset Your Password</h2>
            <p>Enter your email address, and we'll send you a link to reset your password.</p>
            <form class="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="reset-button">Send Reset Link</button>
                <div class="form-links">
                    <p><a href="#" class="login-link">Back to Login</a></p>
                    <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                </div>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 SecureApp. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
