<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Leaderboard Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Sales Leaderboard</h1>
        <button class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">Refresh</button>
    </header>

    <!-- Leaderboard Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Top Performers</h2>
            <div class="space-y-4">
                <div class="flex items-center justify-between bg-pink-100 p-4 rounded-lg animate-slide-up">
                    <div class="flex items-center">
                        <span class="text-2xl font-bold text-pink-600 mr-4">1</span>
                        <div>
                            <p class="font-semibold text-gray-800">John Doe</p>
                            <p class="text-gray-600">$12,345</p>
                        </div>
                    </div>
                    <span class="bg-pink-600 text-white px-3 py-1 rounded">Top Seller</span>
                </div>
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg animate-slide-up">
                    <div class="flex items-center">
                        <span class="text-2xl font-bold text-gray-600 mr-4">2</span>
                        <div>
                            <p class="font-semibold text-gray-800">Jane Smith</p>
                            <p class="text-gray-600">$9,876</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
