<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="py-16">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Checkout Form -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-lg p-6 space-y-6 animate-slide-up">
                <h1 class="text-2xl font-bold">Checkout</h1>
                <!-- Shipping Info -->
                <div>
                    <h2 class="text-lg font-semibold mb-4">Shipping Information</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input type="text" placeholder="Full Name" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <input type="email" placeholder="Email" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <input type="text" placeholder="Address" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 sm:col-span-2" required>
                        <input type="text" placeholder="City" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <input type="text" placeholder="ZIP Code" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                </div>
                <!-- Payment Info -->
                <div>
                    <h2 class="text-lg font-semibold mb-4">Payment Information</h2>
                    <input type="text" placeholder="Card Number" class="p-3 border rounded-lg w-full mb-4 focus:ring-2 focus:ring-blue-500" required>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Expiry Date" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        <input type="text" placeholder="CVV" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                </div>
                <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition transform hover:-translate-y-1 w-full">Place Order</button>
            </div>

            <!-- Order Summary -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">Order Summary</h2>
                <div class="space-y-4">
                    <div class="flex justify-between">
                        <span>Premium Sneakers</span>
                        <span>$120.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Graphic T-Shirt</span>
                        <span>$45.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Shipping</span>
                        <span>$10.00</span>
                    </div>
                    <div class="flex justify-between font-semibold">
                        <span>Total</span>
                        <span>$175.00</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
