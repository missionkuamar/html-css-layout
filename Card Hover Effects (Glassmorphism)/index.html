<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effects (Glassmorphism)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Card 1 -->
        <div class="bg-white bg-opacity-20 backdrop-blur-lg rounded-xl p-6 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-white border-opacity-30">
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Creative Design</h3>
            <p class="text-gray-600">Craft visually stunning designs with our tools.</p>
            <a href="#" class="mt-4 inline-block text-indigo-600 hover:text-indigo-800 font-medium">Learn More</a>
        </div>
        <!-- Card 2 -->
        <div class="bg-white bg-opacity-20 backdrop-blur-lg rounded-xl p-6 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-white border-opacity-30">
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Fast Development</h3>
            <p class="text-gray-600">Build apps quickly with our streamlined process.</p>
            <a href="#" class="mt-4 inline-block text-indigo-600 hover:text-indigo-800 font-medium">Learn More</a>
        </div>
        <!-- Card 3 -->
        <div class="bg-white bg-opacity-20 backdrop-blur-lg rounded-xl p-6 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-white border-opacity-30">
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Secure Solutions</h3>
            <p class="text-gray-600">Protect your data with top-tier security.</p>
            <a href="#" class="mt-4 inline-block text-indigo-600 hover:text-indigo-800 font-medium">Learn More</a>
        </div>
    </div>
</body>
</html>
