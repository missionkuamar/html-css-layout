<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-3xl mx-auto w-full" x-data="{
        testimonials: [
            { text: 'Amazing service and attention to detail!', author: 'Jane Doe, CEO' },
            { text: 'Transformed our business with their expertise.', author: 'John Smith, Founder' },
            { text: 'Highly recommend their professional approach.', author: 'Sarah Lee, Manager' }
        ],
        current: 0,
        init() { setInterval(() => { this.current = (this.current + 1) % this.testimonials.length }, 5000) }
    }">
        <div class="bg-white rounded-xl shadow-lg p-6 text-center">
            <div class="relative">
                <div x-show="true" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 transform translate-x-10" x-transition:enter-end="opacity-100 transform translate-x-0" x-transition:leave="transition ease-in duration-500" x-transition:leave-start="opacity-100 transform translate-x-0" x-transition:leave-end="opacity-0 transform -translate-x-10">
                    <p class="text-gray-600 italic mb-4" x-text="testimonials[current].text"></p>
                    <p class="text-indigo-600 font-semibold" x-text="testimonials[current].author"></p>
                </div>
            </div>
            <div class="flex justify-center gap-2 mt-6">
                <template x-for="(item, index) in testimonials" :key="index">
                    <button @click="current = index" :class="current === index ? 'bg-indigo-600' : 'bg-gray-300'" class="w-3 h-3 rounded-full transition"></button>
                </template>
            </div>
        </div>
    </div>
</body>
</html>
