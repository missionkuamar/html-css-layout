<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattoo Artist Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-oswald">
    <!-- Header -->
    <header class="bg-gray-800 shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-amber-500">InkMaster</a>
            <div class="flex space-x-6">
                <a href="#gallery" class="text-gray-300 hover:text-amber-500 transition">Gallery</a>
                <a href="#contact" class="text-gray-300 hover:text-amber-500 transition">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="bg-cover bg-center py-40 text-center" style="background-image: url('https://via.placeholder.com/1200x600')">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl sm:text-5xl font-bold mb-4 animate-fade-in">Art That Lasts</h1>
            <p class="text-lg sm:text-xl mb-8">Custom tattoos by a master artist.</p>
            <a href="#contact" class="bg-amber-500 text-white px-6 py-3 rounded-lg hover:bg-amber-600 transition transform hover:-translate-y-1">Book Now</a>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="py-16 bg-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-bold mb-8 text-center">My Work</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="Tattoo 1" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">Tribal Design</p>
                    </div>
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="Tattoo 2" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">Floral Art</p>
                    </div>
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="Tattoo 3" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">Portrait Tattoo</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-16 bg-gray-900">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-3xl font-bold mb-8">Book Your Tattoo</h2>
            <form class="space-y-6">
                <input type="text" placeholder="Name" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                <input type="email" placeholder="Email" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                <textarea placeholder="Tattoo Idea & Preferred Date" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-amber-500" rows="5" required></textarea>
                <button type="submit" class="bg-amber-500 text-white px-6 py-3 rounded-lg hover:bg-amber-600 transition transform hover:-translate-y-1">Send Message</button>
            </form>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.8s ease-in-out;
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
