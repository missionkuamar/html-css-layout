<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Notes Sharing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">NoteHub</a>
        </nav>
    </header>

    <!-- Notes Sharing Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Shared Notes</h1>
            <div class="space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h2 class="text-lg font-semibold text-gray-800">Web Development Notes</h2>
                    <p class="text-gray-600 mt-2">Key concepts in HTML, CSS, and JavaScript.</p>
                    <div class="flex space-x-4 mt-2">
                        <a href="#" class="text-teal-600 hover:text-teal-700">View</a>
                        <a href="#" class="text-teal-600 hover:text-teal-700">Share</a>
                    </div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h2 class="text-lg font-semibold text-gray-800">AI Basics</h2>
                    <p class="text-gray-600 mt-2">Introduction to machine learning algorithms.</p>
                    <div class="flex space-x-4 mt-2">
                        <a href="#" class="text-teal-600 hover:text-teal-700">View</a>
                        <a href="#" class="text-teal-600 hover:text-teal-700">Share</a>
                    </div>
                </div>
            </div>
            <form class="mt-6">
                <textarea placeholder="Add your notes..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-500"></textarea>
                <button type="submit" class="mt-2 bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Share Note</button>
            </form>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
