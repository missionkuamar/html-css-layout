<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">ShopTrend</a>
            <div class="flex space-x-6">
                <a href="#checkout" class="text-gray-600 hover:text-teal-600 transition">Checkout</a>
            </div>
        </nav>
    </header>

    <!-- Cart Section -->
    <section class="py-16">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Your Cart</h1>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Cart Items -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white rounded-lg shadow-lg p-6 flex items-center space-x-4 animate-slide-up">
                        <img src="https://via.placeholder.com/100x100" alt="Sneakers" class="w-24 h-24 object-cover rounded-lg">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold">Premium Sneakers</h3>
                            <p class="text-gray-600">$120.00</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <input type="number" value="1" min="1" class="w-16 p-2 border rounded-lg focus:ring-2 focus:ring-teal-500">
                            <button class="text-red-500 hover:text-red-600">Remove</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-lg p-6 flex items-center space-x-4 animate-slide-up">
                        <img src="https://via.placeholder.com/100x100" alt="T-Shirt" class="w-24 h-24 object-cover rounded-lg">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold">Graphic T-Shirt</h3>
                            <p class="text-gray-600">$45.00</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <input type="number" value="2" min="1" class="w-16 p-2 border rounded-lg focus:ring-2 focus:ring-teal-500">
                            <button class="text-red-500 hover:text-red-600">Remove</button>
                        </div>
                    </div>
                </div>

                <!-- Cart Summary -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold mb-4">Order Summary</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between">
                            <span>Subtotal</span>
                            <span>$210.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Shipping</span>
                            <span>$10.00</span>
                        </div>
                        <div class="flex justify-between font-semibold">
                            <span>Total</span>
                            <span>$220.00</span>
                        </div>
                        <button class="bg-teal-600 text-white px-6 py-3 rounded-lg hover:bg-teal-700 transition transform hover:-translate-y-1 w-full">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
