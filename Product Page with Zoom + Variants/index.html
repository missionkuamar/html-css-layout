<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page with Zoom + Variants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">ShopTrend</a>
            <div class="flex space-x-6">
                <a href="#cart" class="text-gray-600 hover:text-indigo-600 transition">Cart</a>
            </div>
        </nav>
    </header>

    <!-- Product Section -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Image with Zoom -->
            <div class="relative group">
                <img id="main-image" src="https://via.placeholder.com/600x600" alt="Product" class="w-full h-[600px] object-cover rounded-lg shadow-lg">
                <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity bg-black bg-opacity-10 cursor-zoom-in" onmousemove="zoom(event)" onmouseleave="resetZoom()">
                    <div id="zoom-lens" class="absolute w-32 h-32 border border-gray-300 rounded-full hidden group-hover:block"></div>
                </div>
                <div class="flex space-x-2 mt-4">
                    <img src="https://via.placeholder.com/100x100" alt="Thumbnail 1" class="w-20 h-20 object-cover rounded-lg cursor-pointer hover:opacity-75" onclick="changeImage('https://via.placeholder.com/600x600')">
                    <img src="https://via.placeholder.com/100x100/FF0000" alt="Thumbnail 2" class="w-20 h-20 object-cover rounded-lg cursor-pointer hover:opacity-75" onclick="changeImage('https://via.placeholder.com/600x600/FF0000')">
                </div>
            </div>

            <!-- Product Details -->
            <div class="space-y-6">
                <h1 class="text-3xl font-bold text-gray-800">Premium Sneakers</h1>
                <p class="text-2xl font-semibold text-indigo-600">$120.00</p>
                <p class="text-gray-600">High-quality sneakers with advanced cushioning for ultimate comfort.</p>

                <!-- Variants: Color -->
                <div>
                    <h3 class="text-lg font-semibold">Color</h3>
                    <div class="flex space-x-4 mt-2">
                        <button class="w-8 h-8 bg-black rounded-full focus:ring-2 focus:ring-indigo-500" aria-label="Black"></button>
                        <button class="w-8 h-8 bg-red-500 rounded-full focus:ring-2 focus:ring-indigo-500" aria-label="Red"></button>
                        <button class="w-8 h-8 bg-blue-500 rounded-full focus:ring-2 focus:ring-indigo-500" aria-label="Blue"></button>
                    </div>
                </div>

                <!-- Variants: Size -->
                <div>
                    <h3 class="text-lg font-semibold">Size</h3>
                    <div class="flex space-x-4 mt-2">
                        <button class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 focus:ring-2 focus:ring-indigo-500">8</button>
                        <button class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 focus:ring-2 focus:ring-indigo-500">9</button>
                        <button class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 focus:ring-2 focus:ring-indigo-500">10</button>
                    </div>
                </div>

                <!-- Add to Cart -->
                <button class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition transform hover:-translate-y-1 w-full">Add to Cart</button>
            </div>
        </div>
    </section>

    <script>
        function changeImage(src) {
            document.getElementById('main-image').src = src;
        }

        function zoom(e) {
            const img = document.getElementById('main-image');
            const lens = document.getElementById('zoom-lens');
            lens.style.display = 'block';

            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left - 80;
            const y = e.clientY - rect.top - 80;

            lens.style.left = `${x}px`;
            lens.style.top = `${y}px`;
            lens.style.backgroundImage = `url(${img.src})`;
            lens.style.backgroundSize = `${img.width * 2}px ${img.height * 2}px`;
            lens.style.backgroundPosition = `-${x * 2}px -${y * 2}px`;
        }

        function resetZoom() {
            document.getElementById('zoom-lens').style.display = 'none';
        }
    </script>

    <style>
        /* Custom Animations */
        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.8s ease-in-out;
        }
        #zoom-lens {
            background-repeat: no-repeat;
            pointer-events: none;
        }
    </style>
</body>
</html>
