<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Hover Animation</title>
    <style>
        /* --------------------------------------
           Reset and Base Styles
        -------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --------------------------------------
           Profile Card
        -------------------------------------- */
        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 350px;
            width: 100%;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            animation: fadeIn 0.8s ease-out;
        }

        .profile-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .profile-card__avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .profile-card:hover .profile-card__avatar {
            transform: scale(1.1);
        }

        .profile-card__name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .profile-card__title {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .profile-card__bio {
            font-size: 0.9rem;
            color: #e5e7eb;
            margin-bottom: 20px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .profile-card:hover .profile-card__bio {
            opacity: 1;
        }

        .profile-card__social {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .profile-card__social-link {
            color: #ffffff;
            font-size: 1.5rem;
            text-decoration: none;
            transform: translateY(50px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .profile-card:hover .profile-card__social-link {
            transform: translateY(0);
            opacity: 1;
        }

        .profile-card__social-link:nth-child(1) { transition-delay: 0.1s; }
        .profile-card__social-link:nth-child(2) { transition-delay: 0.2s; }
        .profile-card__social-link:nth-child(3) { transition-delay: 0.3s; }

        .profile-card__social-link:hover {
            color: #3b82f6;
            transform: scale(1.2);
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (max-width: 600px) {
            .profile-card {
                padding: 20px;
                max-width: 300px;
            }

            .profile-card__avatar {
                width: 100px;
                height: 100px;
            }

            .profile-card__name {
                font-size: 1.5rem;
            }

            .profile-card__title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Profile Card -->
    <div class="profile-card" role="region" aria-label="User Profile Card">
        <img src="https://via.placeholder.com/120" alt="Profile Avatar" class="profile-card__avatar">
        <h2 class="profile-card__name">Jane Doe</h2>
        <p class="profile-card__title">UI/UX Designer</p>
        <p class="profile-card__bio">Passionate about creating user-friendly and visually appealing designs.</p>
        <div class="profile-card__social">
            <a href="#" class="profile-card__social-link" aria-label="Twitter">𝕏</a>
            <a href="#" class="profile-card__social-link" aria-label="LinkedIn">🅛</a>
            <a href="#" class="profile-card__social-link" aria-label="GitHub">🅖</a>
        </div>
    </div>
</body>
</html>
