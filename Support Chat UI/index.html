<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Support Chat</h1>
        <button class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">End Chat</button>
    </header>

    <!-- Chat Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <div class="h-96 overflow-y-auto mb-4 p-4 border rounded-lg">
                <div class="mb-4">
                    <p class="text-teal-600 font-semibold">Support Agent</p>
                    <p class="bg-teal-100 p-3 rounded-lg">How can I assist you today?</p>
                </div>
                <div class="mb-4 text-right">
                    <p class="text-gray-600 font-semibold">You</p>
                    <p class="bg-gray-200 p-3 rounded-lg">I have an issue with my order.</p>
                </div>
            </div>
            <form class="flex space-x-2">
                <input type="text" placeholder="Type your message..." class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-teal-500">
                <button type="submit" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Send</button>
            </form>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
