<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes UI Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">LearnHub</a>
        </nav>
    </header>

    <!-- Quiz Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">HTML Quiz</h1>
            <form id="quizForm" class="space-y-6">
                <div>
                    <p class="text-lg font-semibold text-gray-800">1. What does HTML stand for?</p>
                    <label class="block mt-2"><input type="radio" name="q1" value="a" class="mr-2 accent-teal-600"> Hyper Text Markup Language</label>
                    <label class="block mt-2"><input type="radio" name="q1" value="b" class="mr-2 accent-teal-600"> Hyperlink Text Markup Language</label>
                </div>
                <button type="submit" class="bg-teal-600 text-white px-6 py-3 rounded-lg hover:bg-teal-700 w-full">Submit Quiz</button>
            </form>
            <div id="result" class="mt-4 hidden">
                <p class="text-lg font-semibold text-gray-800">Score: <span id="score"></span>/1</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('quizForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const answer = document.querySelector('input[name="q1"]:checked')?.value;
            const score = answer === 'a' ? 1 : 0;
            document.getElementById('score').textContent = score;
            document.getElementById('result').classList.remove('hidden');
        });
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
