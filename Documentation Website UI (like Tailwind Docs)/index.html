<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Website UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-white shadow transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="p-4"><h2 class="text-xl font-bold text-indigo-600">DocsHub</h2></div>
        <nav class="mt-6">
            <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600">Introduction</a>
            <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600">Installation</a>
            <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600">Components</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8">
            <h1 class="text-2xl font-bold text-gray-800">Introduction</h1>
        </header>
        <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="prose animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-800">Getting Started</h2>
                <p class="text-gray-600">Welcome to DocsHub, a powerful framework for building modern applications.</p>
                <pre class="bg-gray-800 text-white p-4 rounded-lg"><code>npm install docshub</code></pre>
                <h3 class="text-xl font-semibold text-gray-800">Features</h3>
                <ul class="list-disc pl-6 text-gray-600">
                    <li>Responsive design</li>
                    <li>Customizable components</li>
                    <li>Fast performance</li>
                </ul>
            </div>
        </main>
    </div>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
