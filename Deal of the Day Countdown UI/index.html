<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal of the Day Countdown UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Deal of the Day -->
    <section class="py-16">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Deal of the Day</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <img src="https://via.placeholder.com/400x400" alt="Deal Product" class="w-full h-64 object-cover rounded-lg">
                <div class="space-y-4">
                    <h2 class="text-xl font-semibold">Premium Sneakers</h2>
                    <p class="text-gray-600">Original: <span class="line-through">$150.00</span> Now: <span class="text-teal-600 font-bold">$99.00</span></p>
                    <div class="flex space-x-4 text-lg font-semibold" id="countdown">
                        <div><span id="hours">12</span> Hrs</div>
                        <div><span id="minutes">00</span> Mins</div>
                        <div><span id="seconds">00</span> Secs</div>
                    </div>
                    <button class="bg-teal-600 text-white px-6 py-3 rounded-lg hover:bg-teal-700 transition transform hover:-translate-y-1 w-full">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const countdown = () => {
            const end = new Date();
            end.setHours(end.getHours() + 12);
            const timer = setInterval(() => {
                const now = new Date().getTime();
                const distance = end - now;
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
                if (distance < 0) clearInterval(timer);
            }, 1000);
        };
        countdown();
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
