<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar with Events UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Calendar</h1>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Add Event</button>
    </header>

    <!-- Calendar Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">May 2025</h2>
                <div class="flex space-x-2">
                    <button onclick="prevMonth()" class="bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">Prev</button>
                    <button onclick="nextMonth()" class="bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">Next</button>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center">
                <div class="font-semibold">Sun</div>
                <div class="font-semibold">Mon</div>
                <div class="font-semibold">Tue</div>
                <div class="font-semibold">Wed</div>
                <div class="font-semibold">Thu</div>
                <div class="font-semibold">Fri</div>
                <div class="font-semibold">Sat</div>
                <!-- Calendar Days -->
                <div class="col-span-7 grid grid-cols-7 gap-2">
                    <div class="p-2"></div> <!-- Empty cells for offset -->
                    <div class="p-2"></div>
                    <div class="p-2 bg-indigo-100 rounded-lg cursor-pointer hover:bg-indigo-200">1</div>
                    <div class="p-2">2</div>
                    <div class="p-2 bg-indigo-100 rounded-lg cursor-pointer hover:bg-indigo-200">3<div class="text-xs text-indigo-600">Meeting</div></div>
                    <div class="p-2">4</div>
                    <div class="p-2">5</div>
                    <!-- Add more days as needed -->
                </div>
            </div>
        </div>
    </main>

    <script>
        function prevMonth() { console.log('Previous month'); }
        function nextMonth() { console.log('Next month'); }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
