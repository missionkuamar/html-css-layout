<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral System UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Refer a Friend</h1>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Share</button>
    </header>

    <!-- Referral Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Invite Friends, Earn Rewards</h2>
            <p class="text-gray-600 mb-4">Share your unique link and earn $10 for each friend who signs up.</p>
            <div class="flex items-center space-x-2">
                <input type="text" value="https://example.com/ref/abc123" readonly class="flex-1 p-3 border rounded-lg bg-gray-100">
                <button onclick="copyLink()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Copy Link</button>
            </div>
            <div class="mt-6">
                <h3 class="text-lg font-semibold mb-2">Referral Stats</h3>
                <p class="text-gray-600">Invites Sent: 5</p>
                <p class="text-gray-600">Successful Referrals: 2</p>
                <p class="text-gray-600">Earnings: $20</p>
            </div>
        </div>
    </main>

    <script>
        function copyLink() {
            const link = document.querySelector('input[readonly]');
            link.select();
            document.execCommand('copy');
            alert('Link copied!');
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
