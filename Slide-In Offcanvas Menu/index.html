<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-In Offcanvas Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom animation for offcanvas */
        .offcanvas-enter {
            transform: translateX(100%);
        }
        .offcanvas-enter-active {
            transform: translateX(0);
            transition: transform 300ms ease;
        }
        .offcanvas-exit {
            transform: translateX(0);
        }
        .offcanvas-exit-active {
            transform: translateX(100%);
            transition: transform 300ms ease;
        }
    </style>
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">Brand</a>
            <button id="offcanvas-toggle" class="text-gray-700 hover:text-indigo-600 focus:outline-none">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Offcanvas Menu -->
    <div id="offcanvas" class="fixed inset-y-0 right-0 w-64 bg-white shadow-xl hidden offcanvas-enter-active">
        <div class="p-4">
            <div class="flex justify-between items-center mb-6">
                <a href="#" class="text-2xl font-bold text-indigo-600">Menu</a>
                <button id="offcanvas-close" class="text-gray-700 hover:text-indigo-600 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <nav class="space-y-2">
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 rounded-md">Home</a>
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 rounded-md">About</a>
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 rounded-md">Services</a>
                <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 rounded-md">Contact</a>
            </nav>
        </div>
    </div>

    <!-- Sample Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-3xl font-bold text-gray-900">Offcanvas Menu</h1>
        <p class="mt-4 text-gray-600">Click the hamburger icon to see the slide-in menu.</p>
    </main>

    <script>
        const offcanvasToggle = document.getElementById('offcanvas-toggle');
        const offcanvasClose = document.getElementById('offcanvas-close');
        const offcanvas = document.getElementById('offcanvas');

        function toggleOffcanvas() {
            offcanvas.classList.toggle('hidden');
            offcanvas.classList.toggle('offcanvas-enter-active');
        }

        offcanvasToggle.addEventListener('click', toggleOffcanvas);
        offcanvasClose.addEventListener('click', toggleOffcanvas);
    </script>
</body>
</html>
