<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Card UI</title>
  <style>
    /* Modern CSS Reset & Base Styles */
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --text: #2b2d42;
      --light: #f8f9fa;
      --warning: #f72585;
      --radius: 12px;
      --shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
      line-height: 1.6;
    }

    /* Weather Card Component */
    .weather-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    .weather-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    /* Card Header */
    .weather-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 1.5rem;
      text-align: center;
      position: relative;
    }

    .location {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .date {
      opacity: 0.9;
      font-size: 0.9rem;
    }

    /* Current Weather */
    .current-weather {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      animation: float 6s ease-in-out infinite;
    }

    .temperature {
      font-size: 3.5rem;
      font-weight: 300;
      position: relative;
    }

    .temperature::after {
      content: "°C";
      position: absolute;
      top: 0;
      font-size: 1.5rem;
    }

    .weather-meta {
      text-align: right;
    }

    .description {
      font-size: 1.1rem;
      font-weight: 500;
      text-transform: capitalize;
    }

    .feels-like {
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* Weather Details Grid */
    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      padding: 1.5rem;
    }

    .detail-item {
      display: flex;
      align-items: center;
    }

    .detail-icon {
      width: 24px;
      height: 24px;
      margin-right: 0.75rem;
      opacity: 0.8;
    }

    .detail-value {
      font-weight: 600;
    }

    .detail-label {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* Forecast Section */
    .forecast {
      padding: 1rem 1.5rem 1.5rem;
      background: rgba(0,0,0,0.02);
    }

    .forecast-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .forecast-items {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding-bottom: 0.5rem;
    }

    .forecast-item {
      flex: 0 0 auto;
      text-align: center;
      padding: 0.5rem 0.75rem;
      background: rgba(255,255,255,0.7);
      border-radius: 8px;
      min-width: 60px;
    }

    .forecast-day {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .forecast-icon {
      width: 30px;
      height: 30px;
      margin: 0.25rem 0;
    }

    .forecast-temp {
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      .temperature {
        font-size: 3rem;
      }
      .weather-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="weather-header">
      <h1 class="location">San Francisco</h1>
      <p class="date">Monday, June 10 • 3:45 PM</p>
    </div>

    <div class="current-weather">
      <img 
        src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" 
        alt="Sunny" 
        class="weather-icon"
      >
      <div class="temperature">24</div>
      <div class="weather-meta">
        <p class="description">Sunny</p>
        <p class="feels-like">Feels like 26°</p>
      </div>
    </div>

    <div class="weather-details">
      <div class="detail-item">
        <img src="https://cdn-icons-png.flaticon.com/512/7405/7405455.png" class="detail-icon">
        <div>
          <div class="detail-value">72%</div>
          <div class="detail-label">Humidity</div>
        </div>
      </div>
      <div class="detail-item">
        <img src="https://cdn-icons-png.flaticon.com/512/7405/7405473.png" class="detail-icon">
        <div>
          <div class="detail-value">12 km/h</div>
          <div class="detail-label">Wind</div>
        </div>
      </div>
      <div class="detail-item">
        <img src="https://cdn-icons-png.flaticon.com/512/7405/7405489.png" class="detail-icon">
        <div>
          <div class="detail-value">1014 hPa</div>
          <div class="detail-label">Pressure</div>
        </div>
      </div>
      <div class="detail-item">
        <img src="https://cdn-icons-png.flaticon.com/512/7405/7405467.png" class="detail-icon">
        <div>
          <div class="detail-value">6:12 AM</div>
          <div class="detail-label">Sunrise</div>
        </div>
      </div>
    </div>

    <div class="forecast">
      <h3 class="forecast-title">5-Day Forecast</h3>
      <div class="forecast-items">
        <div class="forecast-item">
          <div class="forecast-day">Tue</div>
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" class="forecast-icon">
          <div class="forecast-temp">25°</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">Wed</div>
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163634.png" class="forecast-icon">
          <div class="forecast-temp">22°</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">Thu</div>
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163657.png" class="forecast-icon">
          <div class="forecast-temp">18°</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">Fri</div>
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163657.png" class="forecast-icon">
          <div class="forecast-temp">19°</div>
        </div>
        <div class="forecast-item">
          <div class="forecast-day">Sat</div>
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" class="forecast-icon">
          <div class="forecast-temp">24°</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Dynamic Weather Data (Example)
    document.addEventListener('DOMContentLoaded', () => {
      // Simulate API fetch
      setTimeout(() => {
        const weatherData = {
          location: "New York",
          temp: 22,
          description: "Partly Cloudy",
          humidity: 65,
          wind: 8,
          forecast: [
            { day: "Tue", icon: "cloudy", temp: 21 },
            { day: "Wed", icon: "rain", temp: 18 },
            { day: "Thu", icon: "sunny", temp: 24 },
            { day: "Fri", icon: "sunny", temp: 26 },
            { day: "Sat", icon: "cloudy", temp: 22 }
          ]
        };

        // Update DOM
        document.querySelector('.location').textContent = weatherData.location;
        document.querySelector('.temperature').textContent = weatherData.temp;
        document.querySelector('.description').textContent = weatherData.description;
        
        // Animation for update
        document.querySelector('.weather-card').style.animation = 'none';
        setTimeout(() => {
          document.querySelector('.weather-card').style.animation = 'pulse 0.5s';
        }, 10);
        
      }, 1000);
    });
  </script>
</body>
</html>
