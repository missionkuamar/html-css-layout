<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription History UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Subscription History</h1>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Manage Plan</button>
    </header>

    <!-- History Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Payment History</h2>
            <table class="w-full">
                <thead>
                    <tr class="border-b">
                        <th class="p-4 text-left">Date</th>
                        <th class="p-4 text-left">Plan</th>
                        <th class="p-4 text-left">Amount</th>
                        <th class="p-4 text-left">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b hover:bg-gray-50 animate-slide-up">
                        <td class="p-4">2025-04-30</td>
                        <td class="p-4">Pro</td>
                        <td class="p-4">$29.00</td>
                        <td class="p-4"><span class="bg-green-100 text-green-600 px-2 py-1 rounded">Paid</span></td>
                    </tr>
                    <tr class="border-b hover:bg-gray-50 animate-slide-up">
                        <td class="p-4">2025-03-30</td>
                        <td class="p-4">Pro</td>
                        <td class="p-4">$29.00</td>
                        <td class="p-4"><span class="bg-green-100 text-green-600 px-2 py-1 rounded">Paid</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
