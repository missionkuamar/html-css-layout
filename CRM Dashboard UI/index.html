<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-teal-800 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="p-4"><h2 class="text-xl font-bold">CRM Dashboard</h2></div>
        <nav class="mt-6">
            <a href="#" class="block px-4 py-2 text-teal-200 hover:bg-teal-700 hover:text-white">Customers</a>
            <a href="#" class="block px-4 py-2 text-teal-200 hover:bg-teal-700 hover:text-white">Leads</a>
            <a href="#" class="block px-4 py-2 text-teal-200 hover:bg-teal-700 hover:text-white">Reports</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Customer Overview</h1>
            <button class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Add Customer</button>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Customer List -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Customers</h2>
                <table class="w-full">
                    <thead>
                        <tr class="border-b">
                            <th class="p-4 text-left">Name</th>
                            <th class="p-4 text-left">Email</th>
                            <th class="p-4 text-left">Status</th>
                            <th class="p-4 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b hover:bg-gray-50 animate-slide-up">
                            <td class="p-4">John Doe</td>
                            <td class="p-4">john@example.com</td>
                            <td class="p-4"><span class="bg-green-100 text-green-600 px-2 py-1 rounded">Active</span></td>
                            <td class="p-4"><button class="text-teal-600 hover:text-teal-700">View</button></td>
                        </tr>
                        <tr class="border-b hover:bg-gray-50 animate-slide-up">
                            <td class="p-4">Jane Smith</td>
                            <td class="p-4">jane@example.com</td>
                            <td class="p-4"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded">Pending</span></td>
                            <td class="p-4"><button class="text-teal-600 hover:text-teal-700">View</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
