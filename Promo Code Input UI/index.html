<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Code Input UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Promo Code Section -->
    <section class="py-16">
        <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Apply Promo Code</h1>
            <form class="space-y-4" onsubmit="applyPromo(event)">
                <div class="flex space-x-2">
                    <input type="text" id="promo-code" placeholder="Enter Promo Code" class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-teal-500" required>
                    <button type="submit" class="bg-teal-600 text-white px-4 py-3 rounded-lg hover:bg-teal-700 transition transform hover:-translate-y-1">Apply</button>
                </div>
                <p id="promo-message" class="text-sm text-gray-600 hidden">Promo code applied successfully!</p>
            </form>
        </div>
    </section>

    <script>
        function applyPromo(event) {
            event.preventDefault();
            const code = document.getElementById('promo-code').value;
            const message = document.getElementById('promo-message');
            if (code === 'SAVE10') {
                message.classList.remove('hidden', 'text-red-500');
                message.classList.add('text-green-500');
                message.textContent = 'Promo code applied successfully!';
            } else {
                message.classList.remove('hidden', 'text-green-500');
                message.classList.add('text-red-500');
                message.textContent = 'Invalid promo code.';
            }
        }
    </script>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
