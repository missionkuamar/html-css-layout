<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Billing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Billing</h1>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Logout</button>
    </header>

    <!-- Billing Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Your Subscription</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Plan Details -->
                <div>
                    <h3 class="text-lg font-semibold">Current Plan: Pro</h3>
                    <p class="text-gray-600">$29/month</p>
                    <p class="text-gray-600">Next Billing: May 30, 2025</p>
                    <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Upgrade Plan</button>
                </div>
                <!-- Payment Method -->
                <div>
                    <h3 class="text-lg font-semibold">Payment Method</h3>
                    <p class="text-gray-600">Visa ending in 1234</p>
                    <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Update Payment</button>
                </div>
            </div>
            <!-- Billing History -->
            <div class="mt-8">
                <h3 class="text-lg font-semibold mb-4">Billing History</h3>
                <table class="w-full">
                    <thead>
                        <tr class="border-b">
                            <th class="p-4 text-left">Date</th>
                            <th class="p-4 text-left">Amount</th>
                            <th class="p-4 text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b hover:bg-gray-50 animate-slide-up">
                            <td class="p-4">2025-04-30</td>
                            <td class="p-4">$29.00</td>
                            <td class="p-4"><span class="bg-green-100 text-green-600 px-2 py-1 rounded">Paid</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
