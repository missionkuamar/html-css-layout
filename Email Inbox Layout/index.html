<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Inbox Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-poppins">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-purple-800 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="p-4"><h2 class="text-xl font-bold">Email Inbox</h2></div>
        <nav class="mt-6">
            <a href="#" class="block px-4 py-2 text-purple-200 hover:bg-purple-700 hover:text-white">Inbox</a>
            <a href="#" class="block px-4 py-2 text-purple-200 hover:bg-purple-700 hover:text-white">Sent</a>
            <a href="#" class="block px-4 py-2 text-purple-200 hover:bg-purple-700 hover:text-white">Drafts</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Inbox</h1>
            <button class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Compose</button>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="space-y-4">
                    <div class="border-b pb-4 hover:bg-gray-50 animate-slide-up cursor-pointer">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-semibold text-gray-800">John Doe</p>
                                <p class="text-gray-600">Meeting Schedule</p>
                            </div>
                            <p class="text-gray-500">2025-04-30</p>
                        </div>
                    </div>
                    <div class="border-b pb-4 hover:bg-gray-50 animate-slide-up cursor-pointer">
                        <div class="flex justify-between">
                            <div>
                                <p class="font-semibold text-gray-800">Jane Smith</p>
                                <p class="text-gray-600">Project Update</p>
                            </div>
                            <p class="text-gray-500">2025-04-29</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
