<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-poppins">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-purple-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Gift Card Section -->
    <section class="py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-2 gap-8 animate-slide-up">
            <!-- Gift Card Preview -->
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg p-6 flex items-center justify-center">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">ShopTrend Gift Card</h2>
                    <p class="text-lg mt-2">$<span id="amount">50</span>.00</p>
                    <p class="text-sm mt-2">To: <span id="recipient">Recipient Name</span></p>
                </div>
            </div>
            <!-- Gift Card Form -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">Purchase Gift Card</h2>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold">Amount</label>
                        <select id="gift-amount" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-500" onchange="updatePreview()">
                            <option value="50">$50</option>
                            <option value="100">$100</option>
                            <option value="200">$200</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Recipient Name</label>
                        <input type="text" id="gift-recipient" placeholder="Enter name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-500" oninput="updatePreview()" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Message</label>
                        <textarea placeholder="Optional message" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-500" rows="4"></textarea>
                    </div>
                    <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition transform hover:-translate-y-1 w-full">Add to Cart</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function updatePreview() {
            document.getElementById('amount').textContent = document.getElementById('gift-amount').value;
            document.getElementById('recipient').textContent = document.getElementById('gift-recipient').value || 'Recipient Name';
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
