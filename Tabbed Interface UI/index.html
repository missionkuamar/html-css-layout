<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Interface UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6" x-data="{ activeTab: 'tab1' }">
        <!-- Tabs -->
        <div class="flex border-b">
            <button @click="activeTab = 'tab1'" :class="activeTab === 'tab1' ? 'border-indigo-600 text-indigo-600' : 'text-gray-600'" class="flex-1 py-2 px-4 text-center font-semibold border-b-2 transition">Tab 1</button>
            <button @click="activeTab = 'tab2'" :class="activeTab === 'tab2' ? 'border-indigo-600 text-indigo-600' : 'text-gray-600'" class="flex-1 py-2 px-4 text-center font-semibold border-b-2 transition">Tab 2</button>
            <button @click="activeTab = 'tab3'" :class="activeTab === 'tab3' ? 'border-indigo-600 text-indigo-600' : 'text-gray-600'" class="flex-1 py-2 px-4 text-center font-semibold border-b-2 transition">Tab 3</button>
        </div>
        <!-- Tab Content -->
        <div class="mt-4">
            <div x-show="activeTab === 'tab1'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-4" x-transition:enter-end="opacity-100 transform translate-y-0">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Content 1</h3>
                <p class="text-gray-600">This is the content for the first tab. Customize it as needed.</p>
            </div>
            <div x-show="activeTab === 'tab2'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-4" x-transition:enter-end="opacity-100 transform translate-y-0">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Content 2</h3>
                <p class="text-gray-600">This is the content for the second tab. Add your details here.</p>
            </div>
            <div x-show="activeTab === 'tab3'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-4" x-transition:enter-end="opacity-100 transform translate-y-0">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Content 3</h3>
                <p class="text-gray-600">This is the content for the third tab. Modify as required.</p>
            </div>
        </div>
    </div>
</body>
</html>
