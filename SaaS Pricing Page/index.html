<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Pricing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Pricing</h1>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Sign Up</button>
    </header>

    <!-- Pricing Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Basic Plan -->
            <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                <h2 class="text-xl font-bold text-gray-800">Basic</h2>
                <p class="text-3xl font-bold text-indigo-600 mt-2">$9<span class="text-lg">/mo</span></p>
                <ul class="mt-4 space-y-2">
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> 1 User</li>
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> 10GB Storage</li>
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> Basic Support</li>
                </ul>
                <button class="mt-6 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 w-full">Choose Plan</button>
            </div>
            <!-- Pro Plan -->
            <div class="bg-indigo-600 text-white rounded-lg shadow-lg p-6 animate-slide-up transform md:scale-105">
                <h2 class="text-xl font-bold">Pro</h2>
                <p class="text-3xl font-bold mt-2">$29<span class="text-lg">/mo</span></p>
                <ul class="mt-4 space-y-2">
                    <li class="flex items-center"><span class="text-green-300 mr-2">✔</span> 5 Users</li>
                    <li class="flex items-center"><span class="text-green-300 mr-2">✔</span> 50GB Storage</li>
                    <li class="flex items-center"><span class="text-green-300 mr-2">✔</span> Priority Support</li>
                </ul>
                <button class="mt-6 bg-white text-indigo-600 px-4 py-2 rounded-lg hover:bg-gray-100 w-full">Choose Plan</button>
            </div>
            <!-- Enterprise Plan -->
            <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                <h2 class="text-xl font-bold text-gray-800">Enterprise</h2>
                <p class="text-3xl font-bold text-indigo-600 mt-2">$99<span class="text-lg">/mo</span></p>
                <ul class="mt-4 space-y-2">
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> Unlimited Users</li>
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> 500GB Storage</li>
                    <li class="flex items-center"><span class="text-green-500 mr-2">✔</span> 24/7 Support</li>
                </ul>
                <button class="mt-6 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 w-full">Choose Plan</button>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
