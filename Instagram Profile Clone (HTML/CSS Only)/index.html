<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile Clone</title>
    <style>
        /* --------------------------------------
           Reset and Base Styles
        -------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            color: #1f2937;
        }

        /* --------------------------------------
           Profile Section
        -------------------------------------- */
        .profile {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .profile__header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile__info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .profile__avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile__details {
            flex: 1;
        }

        .profile__username {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .profile__stats {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .profile__stat {
            font-size: 1rem;
            color: #4b5563;
        }

        .profile__bio {
            font-size: 0.9rem;
            color: #4b5563;
        }

        .profile__button {
            background: #0095f6;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .profile__button:hover {
            background: #0077cc;
            transform: scale(1.05);
        }

        /* --------------------------------------
           Posts Section
        -------------------------------------- */
        .posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .post {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.6s ease-in-out;
        }

        .post:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .post__image {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (min-width: 768px) {
            .profile__header {
                flex-direction: row;
                align-items: center;
            }

            .profile__info {
                flex-direction: row;
            }
        }

        @media (max-width: 600px) {
            .profile__info {
                flex-direction: column;
                text-align: center;
            }

            .profile__avatar {
                width: 80px;
                height: 80px;
            }

            .profile__stats {
                justify-content: center;
            }

            .posts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Profile Section -->
    <section class="profile">
        <div class="profile__header">
            <div class="profile__info">
                <img src="https://via.placeholder.com/100" alt="Profile Avatar" class="profile__avatar">
                <div class="profile__details">
                    <h1 class="profile__username">techlover</h1>
                    <div class="profile__stats">
                        <span class="profile__stat">120 Posts</span>
                        <span class="profile__stat">10K Followers</span>
                        <span class="profile__stat">500 Following</span>
                    </div>
                    <p class="profile__bio">Exploring the world of technology and innovation.</p>
                </div>
            </div>
            <a href="#" class="profile__button">Follow</a>
        </div>

        <!-- Posts Section -->
        <div class="posts">
            <div class="post">
                <img src="https://via.placeholder.com/300" alt="Post 1" class="post__image">
            </div>
            <div class="post">
                <img src="https://via.placeholder.com/300" alt="Post 2" class="post__image">
            </div>
            <div class="post">
                <img src="https://via.placeholder.com/300" alt="Post 3" class="post__image">
            </div>
            <div class="post">
                <img src="https://via.placeholder.com/300" alt="Post 4" class="post__image">
            </div>
        </div>
    </section>
</body>
</html>
