<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlify Solutions - Newsletter</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Newsletter Section -->
    <section class="newsletter-container">
        <div class="container">
            <h2>Stay Updated</h2>
            <p>Subscribe to our newsletter for the latest news, tips, and exclusive offers from Nexlify Solutions.</p>
            <form class="newsletter-form" id="newsletter-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <button type="submit" class="submit-button">Subscribe</button>
                </div>
                <p class="success-message" id="success-message">Thank you for subscribing!</p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 Nexlify Solutions. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
