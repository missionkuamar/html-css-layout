<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Page UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Settings</h1>
        <button class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">Save</button>
    </header>

    <!-- Settings Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Account Settings</h2>
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold">Full Name</label>
                    <input type="text" value="John Doe" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold">Email</label>
                    <input type="email" value="john@example.com" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold">Notifications</label>
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 accent-pink-600">
                        <span>Email Notifications</span>
                    </label>
                </div>
            </form>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
