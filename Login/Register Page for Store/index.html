<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register Page for Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Login / Register Section -->
    <section class="py-16">
        <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <!-- Tabs -->
            <div class="flex border-b mb-6">
                <button id="login-tab" class="flex-1 p-3 font-semibold text-pink-600 border-b-2 border-pink-600" onclick="showTab('login')">Login</button>
                <button id="register-tab" class="flex-1 p-3 font-semibold text-gray-600" onclick="showTab('register')">Register</button>
            </div>
            <!-- Login Form -->
            <div id="login" class="form-tab">
                <form class="space-y-4">
                    <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <button type="submit" class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700 transition transform hover:-translate-y-1 w-full">Login</button>
                </form>
            </div>
            <!-- Register Form -->
            <div id="register" class="form-tab hidden">
                <form class="space-y-4">
                    <input type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <button type="submit" class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700 transition transform hover:-translate-y-1 w-full">Register</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.form-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(tab).classList.remove('hidden');
            document.querySelectorAll('.flex-1').forEach(t => {
                t.classList.remove('text-pink-600', 'border-pink-600');
                t.classList.add('text-gray-600');
            });
            document.getElementById(`${tab}-tab`).classList.add('text-pink-600', 'border-pink-600');
            document.getElementById(`${tab}-tab`).classList.remove('text-gray-600');
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
