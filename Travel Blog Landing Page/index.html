<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --------------------------------------
           CSS Variables and Reset
        -------------------------------------- */
        :root {
            --primary: #38a169;
            --secondary: #ffffff;
            --text: #1a202c;
            --accent: #f7fafc;
            --shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background: var(--accent);
            color: var(--text);
            min-height: 100vh;
        }

        /* --------------------------------------
           Header
        -------------------------------------- */
        .header {
            background: var(--secondary);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header__container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header__logo {
            font-family: 'Lora', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .header__nav {
            display: flex;
            gap: 1.5rem;
        }

        .header__link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .header__link:hover {
            color: var(--primary);
        }

        /* --------------------------------------
           Hero Section
        -------------------------------------- */
        .hero {
            background: url('https://via.placeholder.com/1200x600') center/cover;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--secondary);
            animation: fadeIn 1s ease-in-out;
        }

        .hero__title {
            font-family: 'Lora', serif;
            font-size: 4rem;
            font-weight: 700;
        }

        /* --------------------------------------
           Posts Section
        -------------------------------------- */
        .posts {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .post-card {
            background: var(--secondary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            animation: slideUp 0.6s ease-in-out;
        }

        .post-card:hover {
            transform: translateY(-8px);
        }

        .post-card__image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .post-card__content {
            padding: 1.5rem;
        }

        .post-card__title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .post-card__excerpt {
            font-size: 1rem;
            color: #4a5568;
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (min-width: 768px) {
            .posts {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero__title {
                font-size: 5rem;
            }
        }

        @media (max-width: 600px) {
            .header__container {
                flex-direction: column;
                gap: 1rem;
            }

            .header__nav {
                flex-direction: column;
                gap: 0.5rem;
            }

            .hero__title {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">Wanderlust</a>
            <nav class="header__nav">
                <a href="#" class="header__link">Destinations</a>
                <a href="#" class="header__link">Tips</a>
                <a href="#" class="header__link">About</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero__title">Explore the World</h1>
    </section>

    <!-- Posts Section -->
    <section class="posts">
        <article class="post-card">
            <img src="https://via.placeholder.com/300x250" alt="Post 1" class="post-card__image">
            <div class="post-card__content">
                <h3 class="post-card__title">Paris Adventures</h3>
                <p class="post-card__excerpt">Discover the charm of Paris with our travel guide.</p>
            </div>
        </article>
        <article class="post-card">
            <img src="https://via.placeholder.com/300x250" alt="Post 2" class="post-card__image">
            <div class="post-card__content">
                <h3 class="post-card__title">Tokyo Nights</h3>
                <p class="post-card__excerpt">Experience the vibrant nightlife of Tokyo.</p>
            </div>
        </article>
    </section>
</body>
</html>
