<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketing System Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-pink-800 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="p-4"><h2 class="text-xl font-bold">Support Tickets</h2></div>
        <nav class="mt-6">
            <a href="#" class="block px-4 py-2 text-pink-200 hover:bg-pink-700 hover:text-white">Open Tickets</a>
            <a href="#" class="block px-4 py-2 text-pink-200 hover:bg-pink-700 hover:text-white">Closed Tickets</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Tickets</h1>
            <button class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">Create Ticket</button>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Open Tickets</h2>
                <table class="w-full">
                    <thead>
                        <tr class="border-b">
                            <th class="p-4 text-left">Ticket ID</th>
                            <th class="p-4 text-left">Customer</th>
                            <th class="p-4 text-left">Issue</th>
                            <th class="p-4 text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b hover:bg-gray-50 animate-slide-up">
                            <td class="p-4">#T123</td>
                            <td class="p-4">John Doe</td>
                            <td class="p-4">Login Issue</td>
                            <td class="p-4"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded">Open</span></td>
                        </tr>
                        <tr class="border-b hover:bg-gray-50 animate-slide-up">
                            <td class="p-4">#T124</td>
                            <td class="p-4">Jane Smith</td>
                            <td class="p-4">Payment Error</td>
                            <td class="p-4"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded">Open</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
