<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Design Portfolio Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --------------------------------------
           CSS Variables and Reset
        -------------------------------------- */
        :root {
            --primary: #4c51bf;
            --secondary: #ffffff;
            --text: #1a202c;
            --accent: #edf2f7;
            --shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background: var(--accent);
            color: var(--text);
            min-height: 100vh;
        }

        /* --------------------------------------
           Header
        -------------------------------------- */
        .header {
            background: var(--secondary);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header__container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header__logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .header__nav {
            display: flex;
            gap: 1.5rem;
        }

        .header__link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .header__link:hover {
            color: var(--primary);
        }

        /* --------------------------------------
           Gallery Section
        -------------------------------------- */
        .gallery {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-in-out;
        }

        .gallery__item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .gallery__item:hover {
            transform: scale(1.02);
        }

        .gallery__image {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .gallery__overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery__item:hover .gallery__overlay {
            opacity: 1;
        }

        .gallery__title {
            color: var(--secondary);
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* --------------------------------------
           About Section
        -------------------------------------- */
        .about {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 2rem;
            text-align: center;
        }

        .about__title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .about__text {
            font-size: 1.1rem;
            color: #4a5568;
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .header__container {
                flex-direction: column;
                gap: 1rem;
            }

            .header__nav {
                flex-direction: column;
                gap: 0.5rem;
            }

            .gallery__image {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">DesignVibe</a>
            <nav class="header__nav">
                <a href="#" class="header__link">Portfolio</a>
                <a href="#" class="header__link">Services</a>
                <a href="#" class="header__link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="gallery">
        <article class="gallery__item">
            <img src="https://via.placeholder.com/400x400" alt="Project 1" class="gallery__image">
            <div class="gallery__overlay">
                <h3 class="gallery__title">Modern Living</h3>
            </div>
        </article>
        <article class="gallery__item">
            <img src="https://via.placeholder.com/400x400" alt="Project 2" class="gallery__image">
            <div class="gallery__overlay">
                <h3 class="gallery__title">Cozy Bedroom</h3>
            </div>
        </article>
        <article class="gallery__item">
            <img src="https://via.placeholder.com/400x400" alt="Project 3" class="gallery__image">
            <div class="gallery__overlay">
                <h3 class="gallery__title">Minimal Office</h3>
            </div>
        </article>
    </section>

    <!-- About Section -->
    <section class="about">
        <h2 class="about__title">About Us</h2>
        <p class="about__text">We create stunning interiors that blend functionality with aesthetics, tailored to your unique style.</p>
    </section>
</body>
</html>
