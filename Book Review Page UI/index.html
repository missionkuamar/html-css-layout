<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Page UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-poppins">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-purple-600">BookShelf</a>
        </nav>
    </header>

    <!-- Book Review Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <div class="flex flex-col md:flex-row md:space-x-6">
                <img src="https://via.placeholder.com/150" alt="Book Cover" class="w-40 h-56 object-cover rounded-lg mb-4 md:mb-0">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">The Great Gatsby</h1>
                    <p class="text-gray-600 mt-2">By F. Scott Fitzgerald</p>
                    <div class="flex items-center mt-2">
                        <span class="text-yellow-500">★★★★★</span>
                        <span class="ml-2 text-gray-600">4.5/5</span>
                    </div>
                    <p class="text-gray-600 mt-4">A timeless classic exploring the American Dream with vivid prose and complex characters.</p>
                    <a href="#" class="mt-4 inline-block bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Buy Now</a>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
