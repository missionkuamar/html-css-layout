<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment System UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">BlogHub</a>
        </nav>
    </header>

    <!-- Comment Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Comments</h1>
            <div class="space-y-6">
                <div class="border-l-4 border-blue-600 pl-4">
                    <p class="font-semibold text-gray-800">John Doe</p>
                    <p class="text-gray-600 mt-1">Great article! Really insightful.</p>
                    <div class="flex space-x-4 mt-2">
                        <button class="text-blue-600 hover:text-blue-700">Reply</button>
                        <p class="text-gray-500 text-sm">2025-04-30</p>
                    </div>
                    <div class="ml-6 mt-4 border-l-4 border-gray-300 pl-4">
                        <p class="font-semibold text-gray-800">Jane Smith</p>
                        <p class="text-gray-600 mt-1">Thanks, John! Glad you enjoyed it.</p>
                    </div>
                </div>
            </div>
            <form class="mt-6">
                <textarea placeholder="Add a comment..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                <button type="submit" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Post Comment</button>
            </form>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
