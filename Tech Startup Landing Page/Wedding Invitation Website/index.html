<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600 font-great-vibes">Emma & James</a>
            <div class="flex space-x-6">
                <a href="#details" class="text-gray-600 hover:text-pink-600 transition">Details</a>
                <a href="#rsvp" class="text-gray-600 hover:text-pink-600 transition">RSVP</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="bg-cover bg-center py-40 text-center text-white" style="background-image: url('https://via.placeholder.com/1200x600')">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl sm:text-5xl font-bold mb-4 font-great-vibes animate-fade-in">We’re Getting Married!</h1>
            <p class="text-lg sm:text-xl mb-8">Join us on August 20, 2025</p>
            <a href="#rsvp" class="bg-pink-500 text-white px-6 py-3 rounded-lg hover:bg-pink-600 transition transform hover:-translate-y-1">RSVP Now</a>
        </div>
    </section>

    <!-- Details Section -->
    <section id="details" class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 font-great-vibes">Wedding Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white rounded-lg shadow-lg p-6 transform transition hover:scale-105 animate-slide-up">
                    <h3 class="text-xl font-semibold mb-2">Ceremony</h3>
                    <p class="text-gray-600">4:00 PM | St. Mary’s Church</p>
                </div>
                <div class="bg-white rounded-lg shadow-lg p-6 transform transition hover:scale-105 animate-slide-up">
                    <h3 class="text-xl font-semibold mb-2">Reception</h3>
                    <p class="text-gray-600">6:00 PM | Grand Hotel Ballroom</p>
                </div>
            </div>
        </div>
    </section>

    <!-- RSVP Section -->
    <section id="rsvp" class="bg-gray-800 text-white py-16">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-3xl font-bold mb-8 font-great-vibes">RSVP</h2>
            <form class="space-y-6">
                <input type="text" placeholder="Name" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
                <input type="email" placeholder="Email" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
                <select class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
                    <option value="" disabled selected>Attending?</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
                <button type="submit" class="bg-pink-500 text-white px-6 py-3 rounded-lg hover:bg-pink-600 transition transform hover:-translate-y-1">Submit RSVP</button>
            </form>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.8s ease-in-out;
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
