<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --------------------------------------
           CSS Variables and Reset
        -------------------------------------- */
        :root {
            --primary: #2d3748;
            --secondary: #ffffff;
            --text: #1a202c;
            --accent: #38a169;
            --shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #f7fafc;
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        /* --------------------------------------
           Comparison Table
        -------------------------------------- */
        .comparison {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-in-out;
        }

        .comparison__title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .comparison__table {
            width: 100%;
            border-collapse: collapse;
            background: var(--secondary);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .comparison__thead {
            background: var(--primary);
            color: var(--secondary);
        }

        .comparison__th {
            padding: 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
        }

        .comparison__td {
            padding: 1rem;
            font-size: 1rem;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .comparison__feature {
            text-align: left;
            font-weight: 500;
        }

        .comparison__check {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .comparison__cross {
            color: #e53e3e;
            font-size: 1.5rem;
        }

        .comparison__button {
            background: var(--accent);
            color: var(--secondary);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .comparison__button:hover {
            background: #2f855a;
            transform: scale(1.05);
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (max-width: 768px) {
            .comparison__table {
                display: block;
                overflow-x: auto;
            }

            .comparison__th, .comparison__td {
                min-width: 120px;
            }

            .comparison__title {
                font-size: 2rem;
            }
        }

        @media (max-width: 600px) {
            .comparison__th, .comparison__td {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Comparison Table -->
    <section class="comparison">
        <h1 class="comparison__title">Compare Our Products</h1>
        <table class="comparison__table">
            <thead class="comparison__thead">
                <tr>
                    <th class="comparison__th">Feature</th>
                    <th class="comparison__th">Basic</th>
                    <th class="comparison__th">Pro</th>
                    <th class="comparison__th">Enterprise</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="comparison__td comparison__feature">Unlimited Users</td>
                    <td class="comparison__td comparison__cross">✗</td>
                    <td class="comparison__td comparison__check">✓</td>
                    <td class="comparison__td comparison__check">✓</td>
                </tr>
                <tr>
                    <td class="comparison__td comparison__feature">Custom Analytics</td>
                    <td class="comparison__td comparison__cross">✗</td>
                    <td class="comparison__td comparison__cross">✗</td>
                    <td class="comparison__td comparison__check">✓</td>
                </tr>
                <tr>
                    <td class="comparison__td comparison__feature">24/7 Support</td>
                    <td class="comparison__td comparison__cross">✗</td>
                    <td class="comparison__td comparison__check">✓</td>
                    <td class="comparison__td comparison__check">✓</td>
                </tr>
                <tr>
                    <td class="comparison__td comparison__feature">Price</td>
                    <td class="comparison__td">$9/month</td>
                    <td class="comparison__td">$29/month</td>
                    <td class="comparison__td">$99/month</td>
                </tr>
                <tr>
                    <td class="comparison__td"></td>
                    <td class="comparison__td"><a href="#" class="comparison__button">Choose</a></td>
                    <td class="comparison__td"><a href="#" class="comparison__button">Choose</a></td>
                    <td class="comparison__td"><a href="#" class="comparison__button">Choose</a></td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
