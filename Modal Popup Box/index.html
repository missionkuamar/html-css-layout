<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlify Solutions - Modal Popup</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Modal Trigger Section -->
    <section class="modal-trigger-container">
        <div class="container">
            <h2>Discover Our Modal Popup</h2>
            <p>Click the button below to open a sample modal popup.</p>
            <button class="trigger-button" id="open-modal">Open Modal</button>
        </div>
    </section>

    <!-- Modal Popup -->
    <div class="modal" id="modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <span class="close-button" id="close-modal" role="button" aria-label="Close modal">×</span>
            <h3 id="modal-title">Welcome to Nexlify Solutions</h3>
            <p>This is a sample modal popup. You can add forms, text, or other content here to engage your users.</p>
            <button class="modal-action-button">Learn More</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 Nexlify Solutions. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
