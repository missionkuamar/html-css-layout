<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-step Checkout Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="py-16">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <!-- Progress Bar -->
            <div class="flex justify-between mb-8">
                <div class="text-center">
                    <div class="w-8 h-8 bg-pink-600 text-white rounded-full flex items-center justify-center mx-auto">1</div>
                    <p class="text-sm mt-2">Shipping</p>
                </div>
                <div class="text-center">
                    <div class="w-8 h-8 bg-gray-300 text-white rounded-full flex items-center justify-center mx-auto">2</div>
                    <p class="text-sm mt-2">Payment</p>
                </div>
                <div class="text-center">
                    <div class="w-8 h-8 bg-gray-300 text-white rounded-full flex items-center justify-center mx-auto">3</div>
                    <p class="text-sm mt-2">Confirm</p>
                </div>
            </div>

            <!-- Step 1: Shipping -->
            <div id="step-1" class="step">
                <h2 class="text-xl font-bold mb-4">Shipping Information</h2>
                <form class="space-y-4">
                    <input type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <input type="text" placeholder="Address" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <button type="button" onclick="nextStep(2)" class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700 transition transform hover:-translate-y-1 w-full">Next</button>
                </form>
            </div>

            <!-- Step 2: Payment -->
            <div id="step-2" class="step hidden">
                <h2 class="text-xl font-bold mb-4">Payment Information</h2>
                <form class="space-y-4">
                    <input type="text" placeholder="Card Number" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Expiry" class="p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                        <input type="text" placeholder="CVV" class="p-3 border rounded-lg focus:ring-2 focus:ring-pink-500" required>
                    </div>
                    <button type="button" onclick="nextStep(3)" class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700 transition transform hover:-translate-y-1 w-full">Next</button>
                </form>
            </div>

            <!-- Step 3: Confirm -->
            <div id="step-3" class="step hidden">
                <h2 class="text-xl font-bold mb-4">Order Confirmation</h2>
                <p class="text-gray-600 mb-4">Review your order and confirm.</p>
                <button type="button" class="bg-pink-600 text-white px-6 py-3 rounded-lg hover:bg-pink-700 transition transform hover:-translate-y-1 w-full">Place Order</button>
            </div>
        </div>
    </section>

    <script>
        function nextStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
            document.getElementById(`step-${step}`).classList.remove('hidden');
            document.querySelectorAll('.w-8.h-8').forEach((el, i) => {
                el.classList.remove('bg-pink-600', 'bg-gray-300');
                el.classList.add(i < step ? 'bg-pink-600' : 'bg-gray-300');
            });
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
