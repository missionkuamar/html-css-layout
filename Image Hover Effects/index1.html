<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlify Solutions - Image Hover Effects</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header class="header-container">
        <div class="container">
            <h1>Image Hover Effects</h1>
            <p>Hover over the images below to explore interactive effects by Nexlify Solutions.</p>
        </div>
    </header>

    <!-- Image Hover Effects Section -->
    <section class="gallery-container">
        <div class="container">
            <div class="gallery-grid">
                <!-- Image 1: Zoom Effect -->
                <div class="gallery-item zoom-effect">
                    <img src="https://via.placeholder.com/400" alt="Project 1">
                    <div class="overlay">
                        <h3>Project 1</h3>
                        <a href="#" class="cta-button">View Details</a>
                    </div>
                </div>
                <!-- Image 2: Overlay Effect -->
                <div class="gallery-item overlay-effect">
                    <img src="https://via.placeholder.com/400" alt="Project 2">
                    <div class="overlay">
                        <h3>Project 2</h3>
                        <a href="#" class="cta-button">View Details</a>
                    </div>
                </div>
                <!-- Image 3: Rotate Effect -->
                <div class="gallery-item rotate-effect">
                    <img src="https://via.placeholder.com/400" alt="Project 3">
                    <div class="overlay">
                        <h3>Project 3</h3>
                        <a href="#" class="cta-button">View Details</a>
                    </div>
                </div>
                <!-- Image 4: Grayscale Effect -->
                <div class="gallery-item grayscale-effect">
                    <img src="https://via.placeholder.com/400" alt="Project 4">
                    <div class="overlay">
                        <h3>Project 4</h3>
                        <a href="#" class="cta-button">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 Nexlify Solutions. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
