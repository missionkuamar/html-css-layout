<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark/Light Mode Toggle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body x-data="{ darkMode: false }" :class="darkMode ? 'dark bg-gray-900' : 'bg-gray-100'" class="min-h-screen transition-colors duration-300">
    <!-- Toggle Button -->
    <div class="fixed top-4 right-4">
        <button @click="darkMode = !darkMode" class="p-2 bg-gray-200 dark:bg-gray-700 rounded-full focus:outline-none">
            <svg x-show="!darkMode" class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg x-show="darkMode" class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </div>
    <!-- Content -->
    <div class="max-w-4xl mx-auto py-12 px-4 text-center">
        <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6">Dark/Light Mode Toggle</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-4">Toggle between dark and light modes using the button in the top-right corner.</p>
        <p class="text-gray-600 dark:text-gray-300">This is a sample page to demonstrate the theme switcher. Customize it as needed.</p>
    </div>
</body>
</html>
