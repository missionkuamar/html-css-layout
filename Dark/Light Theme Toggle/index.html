<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlify Solutions - Dark/Light Theme Toggle</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header class="header-container">
        <div class="container">
            <h1>Nexlify Solutions</h1>
            <div class="theme-toggle">
                <label for="theme-switch" class="theme-label">Toggle Theme</label>
                <input type="checkbox" id="theme-switch" aria-label="Toggle between dark and light theme">
                <span class="slider"></span>
            </div>
        </div>
    </header>

    <!-- Content Section -->
    <section class="content-container">
        <div class="container">
            <h2>Welcome to Our Platform</h2>
            <p>Explore innovative solutions tailored to your needs. Switch between dark and light themes to customize your experience.</p>
            <button class="cta-button">Learn More</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2025 Nexlify Solutions. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
