<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">MarkDown</a>
        </nav>
    </header>

    <!-- Markdown Editor Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Markdown Editor</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <textarea id="markdownInput" placeholder="Write markdown here..." class="w-full h-96 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                <div id="markdownPreview" class="prose p-3 border rounded-lg bg-gray-50"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const input = document.getElementById('markdownInput');
        const preview = document.getElementById('markdownPreview');
        input.addEventListener('input', () => {
            preview.innerHTML = marked.parse(input.value);
        });
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
