<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-montserrat">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">TravelEasy</a>
            <div class="flex space-x-6">
                <a href="#destinations" class="text-gray-600 hover:text-blue-600 transition">Destinations</a>
                <a href="#search" class="text-gray-600 hover:text-blue-600 transition">Search</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="bg-cover bg-center py-40 text-center text-white" style="background-image: url('https://via.placeholder.com/1200x600')">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl sm:text-5xl font-bold mb-4 animate-fade-in">Explore the World</h1>
            <p class="text-lg sm:text-xl mb-8">Book flights, hotels, and tours with ease.</p>
            <a href="#search" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition transform hover:-translate-y-1">Start Planning</a>
        </div>
    </section>

    <!-- Destinations Section -->
    <section id="destinations" class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Top Destinations</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="Paris" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">Paris, France</p>
                    </div>
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="Tokyo" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">Tokyo, Japan</p>
                    </div>
                </div>
                <div class="relative overflow-hidden rounded-lg shadow-lg transform transition hover:scale-105 animate-slide-up">
                    <img src="https://via.placeholder.com/400x400" alt="New York" class="w-full h-64 object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                        <p class="text-white font-semibold">New York, USA</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Search Section -->
    <section id="search" class="bg-gray-800 text-white py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-3xl font-bold mb-8">Plan Your Trip</h2>
            <form class="space-y-6 sm:grid sm:grid-cols-2 sm:gap-4 sm:space-y-0">
                <input type="text" placeholder="Destination" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <input type="date" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <input type="number" placeholder="Travelers" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <input type="text" placeholder="Budget" class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <button type="submit" class="sm:col-span-2 bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition transform hover:-translate-y-1">Search</button>
            </form>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.8s ease-in-out;
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
