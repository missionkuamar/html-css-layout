<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Sidebar Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">ShopTrend</a>
            <div class="flex space-x-6">
                <a href="#products" class="text-gray-600 hover:text-indigo-600 transition">Products</a>
            </div>
        </nav>
    </header>

    <!-- Sidebar Filter -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-lg shadow-lg animate-slide-up">
                <h2 class="text-xl font-bold mb-6">Filters</h2>
                <!-- Category Filter -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-2">Categories</h3>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> Electronics</label>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> Fashion</label>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> Home</label>
                </div>
                <!-- Price Filter -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-2">Price Range</h3>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> $0 - $50</label>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> $50 - $100</label>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> $100+</label>
                </div>
                <!-- Rating Filter -->
                <div>
                    <h3 class="text-lg font-semibold mb-2">Rating</h3>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> 4 Stars & Up</label>
                    <label class="block"><input type="checkbox" class="mr-2 accent-indigo-600" onchange="filterProducts()"> 3 Stars & Up</label>
                </div>
            </aside>

            <!-- Product Placeholder -->
            <div class="lg:col-span-3">
                <h2 class="text-2xl font-bold mb-4">Products</h2>
                <p class="text-gray-600">Filtered products will appear here.</p>
            </div>
        </div>
    </section>

    <script>
        function filterProducts() {
            // Placeholder for filter logic
            console.log('Filtering products...');
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
