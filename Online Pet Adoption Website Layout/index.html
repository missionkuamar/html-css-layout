<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pet Adoption Website Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --------------------------------------
           CSS Variables and Reset
        -------------------------------------- */
        :root {
            --primary: #ed8936;
            --secondary: #ffffff;
            --text: #1a202c;
            --accent: #f7fafc;
            --shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--accent);
            color: var(--text);
            min-height: 100vh;
        }

        /* --------------------------------------
           Header
        -------------------------------------- */
        .header {
            background: var(--secondary);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header__container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header__logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .header__nav {
            display: flex;
            gap: 1.5rem;
        }

        .header__link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .header__link:hover {
            color: var(--primary);
        }

        /* --------------------------------------
           Hero Section
        -------------------------------------- */
        .hero {
            background: url('https://via.placeholder.com/1200x600') center/cover;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--secondary);
            animation: fadeIn 1s ease-in-out;
        }

        .hero__title {
            font-size: 3rem;
            font-weight: 700;
        }

        /* --------------------------------------
           Pets Section
        -------------------------------------- */
        .pets {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .pet-card {
            background: var(--secondary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            animation: slideUp 0.6s ease-in-out;
        }

        .pet-card:hover {
            transform: translateY(-8px);
        }

        .pet-card__image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .pet-card__content {
            padding: 1.5rem;
        }

        .pet-card__name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .pet-card__info {
            font-size: 1rem;
            color: #4a5568;
            margin-bottom: 1rem;
        }

        .pet-card__button {
            background: var(--primary);
            color: var(--secondary);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .pet-card__button:hover {
            background: #dd6b20;
            transform: scale(1.05);
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (min-width: 768px) {
            .pets {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero__title {
                font-size: 4rem;
            }
        }

        @media (max-width: 600px) {
            .header__container {
                flex-direction: column;
                gap: 1rem;
            }

            .header__nav {
                flex-direction: column;
                gap: 0.5rem;
            }

            .hero__title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">PetPals</a>
            <nav class="header__nav">
                <a href="#" class="header__link">Adopt</a>
                <a href="#" class="header__link">Donate</a>
                <a href="#" class="header__link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero__title">Find Your Furry Friend</h1>
    </section>

    <!-- Pets Section -->
    <section class="pets">
        <article class="pet-card">
            <img src="https://via.placeholder.com/300x250" alt="Pet 1" class="pet-card__image">
            <div class="pet-card__content">
                <h3 class="pet-card__name">Luna</h3>
                <p class="pet-card__info">2 years old, Female, Labrador</p>
                <a href="#" class="pet-card__button">Adopt Now</a>
            </div>
        </article>
        <article class="pet-card">
            <img src="https://via.placeholder.com/300x250" alt="Pet 2" class="pet-card__image">
            <div class="pet-card__content">
                <h3 class="pet-card__name">Max</h3>
                <p class="pet-card__info">1 year old, Male, Golden Retriever</p>
                <a href="#" class="pet-card__button">Adopt Now</a>
            </div>
        </article>
        <article class="pet-card">
            <img src="https://via.placeholder.com/300x250" alt="Pet 3" class="pet-card__image">
            <div class="pet-card__content">
                <h3 class="pet-card__name">Bella</h3>
                <p class="pet-card__info">3 years old, Female, Beagle</p>
                <a href="#" class="pet-card__button">Adopt Now</a>
            </div>
        </article>
    </section>
</body>
</html>
