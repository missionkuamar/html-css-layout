<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Typing Effect (CSS Only)</title>
    <style>
        /* --------------------------------------
           Reset and Base Styles
        -------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --------------------------------------
           Typing Container
        -------------------------------------- */
        .typing {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .typing__title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .typing__text {
            font-size: 1.8rem;
            color: #3b82f6;
            overflow: hidden;
            white-space: nowrap;
            border-right: 4px solid #3b82f6;
            width: 0;
            animation: typing 4s steps(30, end) infinite, blink 0.75s step-end infinite;
        }

        /* --------------------------------------
           Animations
        -------------------------------------- */
        @keyframes typing {
            0% { width: 0; }
            50% { width: 100%; }
            100% { width: 0; }
        }

        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #3b82f6; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --------------------------------------
           Responsive Design (Mobile-First)
        -------------------------------------- */
        @media (min-width: 768px) {
            .typing__title {
                font-size: 3.5rem;
            }

            .typing__text {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 600px) {
            .typing__title {
                font-size: 2rem;
            }

            .typing__text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Typing Section -->
    <section class="typing" role="region" aria-label="Typing Effect">
        <h1 class="typing__title">CSS Typing Effect</h1>
        <p class="typing__text">Create amazing animations with CSS!</p>
    </section>
</body>
</html>
