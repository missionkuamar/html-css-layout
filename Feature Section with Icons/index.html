<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Section with Icons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-12 px-4">
    <div class="max-w-6xl mx-auto text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Our Features</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Feature 1 -->
            <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                <svg class="w-12 h-12 text-indigo-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Fast Performance</h3>
                <p class="text-gray-600">Experience lightning-fast load times.</p>
            </div>
            <!-- Feature 2 -->
            <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                <svg class="w-12 h-12 text-indigo-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-2.76-2.24-5-5-5S2 8.24 2 11m20 0c0-2.76-2.24-5-5-5s-5 2.24-5 5" />
                </svg>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Scalable Solutions</h3>
                <p class="text-gray-600">Grow effortlessly with our platform.</p>
            </div>
            <!-- Feature 3 -->
            <div class="bg-white rounded-xl shadow-lg p-6 text-center">
                <svg class="w-12 h-12 text-indigo-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Reliable Support</h3>
                <p class="text-gray-600">Get help whenever you need it.</p>
            </div>
        </div>
    </div>
</body>
</html>
