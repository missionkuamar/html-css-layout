<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Grid with Filters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-poppins">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-purple-600">ShopTrend</a>
            <div class="flex space-x-6">
                <a href="#cart" class="text-gray-600 hover:text-purple-600 transition">Cart</a>
            </div>
        </nav>
    </header>

    <!-- Filters and Grid -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Filters -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4">Filters</h2>
                <!-- Category Filter -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold">Category</h3>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> Sneakers</label>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> Apparel</label>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> Accessories</label>
                </div>
                <!-- Price Filter -->
                <div>
                    <h3 class="text-lg font-semibold">Price</h3>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> Under $50</label>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> $50 - $100</label>
                    <label class="block mt-2"><input type="checkbox" class="mr-2" onchange="filterProducts()"> Over $100</label>
                </div>
            </aside>

            <!-- Product Grid -->
            <div class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow-lg overflow-hidden transform transition hover:scale-105 animate-slide-up product" data-category="Sneakers" data-price="120">
                    <img src="https://via.placeholder.com/400x250" alt="Sneakers" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold">Premium Sneakers</h3>
                        <p class="text-gray-600">$120.00</p>
                        <button class="mt-2 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Add to Cart</button>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-lg overflow-hidden transform transition hover:scale-105 animate-slide-up product" data-category="Apparel" data-price="45">
                    <img src="https://via.placeholder.com/400x250" alt="T-Shirt" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold">Graphic T-Shirt</h3>
                        <p class="text-gray-600">$45.00</p>
                        <button class="mt-2 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Add to Cart</button>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-lg overflow-hidden transform transition hover:scale-105 animate-slide-up product" data-category="Accessories" data-price="80">
                    <img src="https://via.placeholder.com/400x250" alt="Watch" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-lg font-semibold">Smart Watch</h3>
                        <p class="text-gray-600">$80.00</p>
                        <button class="mt-2 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function filterProducts() {
            const products = document.querySelectorAll('.product');
            const categoryFilters = Array.from(document.querySelectorAll('input[type="checkbox"][name="category"]')).filter(cb => cb.checked).map(cb => cb.parentElement.textContent.trim());
            const priceFilters = Array.from(document.querySelectorAll('input[type="checkbox"][name="price"]')).filter(cb => cb.checked).map(cb => cb.parentElement.textContent.trim());

            products.forEach(product => {
                const category = product.dataset.category;
                const price = parseFloat(product.dataset.price);
                let show = true;

                if (categoryFilters.length > 0 && !categoryFilters.includes(category)) {
                    show = false;
                }

                if (priceFilters.length > 0) {
                    if (priceFilters.includes('Under $50') && price >= 50) show = false;
                    if (priceFilters.includes('$50 - $100') && (price < 50 || price > 100)) show = false;
                    if (priceFilters.includes('Over $100') && price <= 100) show = false;
                }

                product.style.display = show ? 'block' : 'none';
            });
        }
    </script>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
