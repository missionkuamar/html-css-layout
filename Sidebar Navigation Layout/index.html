<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="bg-gray-800 text-white w-64 min-h-screen p-4 hidden md:block">
            <div class="flex items-center mb-6">
                <a href="#" class="text-2xl font-bold">Dashboard</a>
            </div>
            <nav class="space-y-2">
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1-1h-3M6 21h12a1 1 0 001-1v-7H5v7a1 1 0 001 1z" />
                    </svg>
                    Home
                </a>
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Profile
                </a>
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .645 1.825.361 2.573-1.066z" />
                    </svg>
                    Settings
                </a>
            </nav>
        </aside>
        <!-- Mobile Menu Button -->
        <div class="md:hidden p-4">
            <button id="sidebar-toggle" class="text-gray-700 hover:text-indigo-600 focus:outline-none">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
        <!-- Mobile Sidebar -->
        <aside id="mobile-sidebar" class="bg-gray-800 text-white w-64 min-h-screen p-4 absolute top-0 left-0 hidden md:hidden">
            <div class="flex items-center mb-6">
                <a href="#" class="text-2xl font-bold">Dashboard</a>
            </div>
            <nav class="space-y-2">
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">Home</a>
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">Profile</a>
                <a href="#" class="flex items-center px-4 py-2 text-gray-200 hover:bg-gray-700 rounded-md">Settings</a>
            </nav>
        </aside>
        <!-- Main Content -->
        <main class="flex-1 p-6">
            <h1 class="text-3xl font-bold text-gray-900">Sidebar Navigation</h1>
            <p class="mt-4 text-gray-600">This is a responsive sidebar layout using Tailwind CSS.</p>
        </main>
    </div>

    <script>
        // Mobile Sidebar Toggle
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const mobileSidebar = document.getElementById('mobile-sidebar');
        sidebarToggle.addEventListener('click', () => {
            mobileSidebar.classList.toggle('hidden');
        });
    </script>
</body>
</html>
