<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base Article Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-pink-600">KnowledgeHub</a>
        </nav>
    </header>

    <!-- Knowledge Base Article Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Article -->
        <article class="lg:col-span-3 bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">How to Reset Your Password</h1>
            <p class="text-gray-600 mb-4">Follow these steps to reset your password securely.</p>
            <ol class="list-decimal pl-6 space-y-2 text-gray-600">
                <li>Go to the login page and click "Forgot Password."</li>
                <li>Enter your email address.</li>
                <li>Check your inbox for a reset link.</li>
            </ol>
        </article>
        <!-- Related Articles -->
        <aside class="lg:col-span-1">
            <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Related Articles</h2>
                <ul class="space-y-2">
                    <li><a href="#" class="text-pink-600 hover:text-pink-700">How to Update Your Profile</a></li>
                    <li><a href="#" class="text-pink-600 hover:text-pink-700">Account Security Tips</a></li>
                </ul>
            </div>
        </aside>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
