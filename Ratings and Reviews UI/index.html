<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings and Reviews UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">ReviewHub</a>
        </nav>
    </header>

    <!-- Ratings and Reviews Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Ratings & Reviews</h1>
            <div class="space-y-6">
                <div>
                    <div class="flex items-center">
                        <p class="font-semibold text-gray-800">John Doe</p>
                        <span class="ml-2 text-yellow-500">★★★★★</span>
                    </div>
                    <p class="text-gray-600 mt-1">Excellent product, highly recommend!</p>
                    <p class="text-gray-500 text-sm mt-1">2025-04-30</p>
                </div>
            </div>
            <form class="mt-6">
                <div class="flex items-center mb-4">
                    <label class="mr-2 text-gray-800">Rating:</label>
                    <select class="p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option>★★★★★</option>
                        <option>★★★★</option>
                        <option>★★★</option>
                        <option>★★</option>
                        <option>★</option>
                    </select>
                </div>
                <textarea placeholder="Write your review..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                <button type="submit" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Submit Review</button>
            </form>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
