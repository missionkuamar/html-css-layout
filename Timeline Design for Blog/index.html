<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Design for Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-teal-600">BlogHub</a>
        </nav>
    </header>

    <!-- Timeline Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Our Journey</h1>
            <div class="relative border-l-4 border-teal-600 pl-6 space-y-8">
                <div class="relative">
                    <div class="absolute -left-8 top-0 w-4 h-4 bg-teal-600 rounded-full"></div>
                    <h2 class="text-lg font-semibold text-gray-800">January 2024</h2>
                    <p class="text-gray-600">Launched BlogHub with 10 posts.</p>
                </div>
                <div class="relative">
                    <div class="absolute -left-8 top-0 w-4 h-4 bg-teal-600 rounded-full"></div>
                    <h2 class="text-lg font-semibold text-gray-800">April 2025</h2>
                    <p class="text-gray-600">Reached 100,000 readers.</p>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
