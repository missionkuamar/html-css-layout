<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Flags Toggle Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-manrope">
    <!-- Header -->
    <header class="bg-white shadow py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Feature Flags</h1>
        <button class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Save Changes</button>
    </header>

    <!-- Feature Flags Section -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Manage Features</h2>
            <div class="space-y-4">
                <div class="flex items-center justify-between animate-slide-up">
                    <div>
                        <p class="font-semibold text-gray-800">Dark Mode</p>
                        <p class="text-gray-600 text-sm">Enable dark theme for users</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-teal-600 transition"></div>
                        <div class="absolute w-4 h-4 bg-white rounded-full top-1 left-1 peer-checked:translate-x-5 transition"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between animate-slide-up">
                    <div>
                        <p class="font-semibold text-gray-800">Analytics Dashboard</p>
                        <p class="text-gray-600 text-sm">Enable advanced analytics</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-teal-600 transition"></div>
                        <div class="absolute w-4 h-4 bg-white rounded-full top-1 left-1 peer-checked:translate-x-5 transition"></div>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
