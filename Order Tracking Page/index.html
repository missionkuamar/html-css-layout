<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-montserrat">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-green-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Tracking Section -->
    <section class="py-16">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Track Your Order</h1>
            <div class="bg-white rounded-lg shadow-lg p-6 space-y-6 animate-slide-up">
                <div>
                    <h2 class="text-xl font-semibold">Order #12345</h2>
                    <p class="text-gray-600">Placed on April 25, 2025</p>
                </div>
                <!-- Progress Bar -->
                <div class="relative">
                    <div class="flex justify-between mb-2">
                        <span class="text-sm font-semibold">Ordered</span>
                        <span class="text-sm font-semibold">Shipped</span>
                        <span class="text-sm font-semibold">Delivered</span>
                    </div>
                    <div class="h-2 bg-gray-200 rounded-full">
                        <div class="h-2 bg-green-600 rounded-full" style="width: 66%"></div>
                    </div>
                </div>
                <p class="text-gray-600">Estimated Delivery: May 2, 2025</p>
                <div class="border-t pt-4">
                    <h3 class="text-lg font-semibold">Items</h3>
                    <div class="flex justify-between mt-2">
                        <span>Premium Sneakers</span>
                        <span>$120.00</span>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span>Graphic T-Shirt</span>
                        <span>$45.00</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        /* Custom Animations */
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
