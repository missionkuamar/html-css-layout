<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Episode Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-600">PodHub</a>
        </nav>
    </header>

    <!-- Podcast Episode Section -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Episode 42: The Future of AI</h1>
            <p class="text-gray-600 mb-4">Published: April 30, 2025 | Duration: 45 min</p>
            <audio controls class="w-full mb-6">
                <source src="https://example.com/podcast.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <p class="text-gray-600 mb-6">In this episode, we explore how AI is shaping industries with expert guests.</p>
            <div class="flex space-x-4">
                <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Subscribe</a>
                <a href="#" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300">Share</a>
            </div>
        </div>
    </main>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.6s ease-in-out; }
    </style>
</body>
</html>
