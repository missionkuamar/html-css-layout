<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search + Filter Results Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-source-sans">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">ShopTrend</a>
        </nav>
    </header>

    <!-- Search + Results -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Search Bar -->
            <div class="mb-8">
                <input type="text" placeholder="Search products..." class="w-full p-4 rounded-lg border focus:ring-2 focus:ring-blue-500" oninput="searchProducts()">
            </div>
            <!-- Filters -->
            <div class="flex flex-wrap gap-4 mb-6">
                <select class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" onchange="filterResults()">
                    <option>Sort by: Relevance</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                </select>
                <select class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" onchange="filterResults()">
                    <option>Category: All</option>
                    <option>Electronics</option>
                    <option>Fashion</option>
                </select>
            </div>
            <!-- Results -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                    <img src="https://via.placeholder.com/400x250" alt="Product" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-lg font-semibold">Smartphone</h3>
                    <p class="text-gray-600">$299.00</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Add to Cart</button>
                </div>
                <div class="bg-white rounded-lg shadow-lg p-6 animate-slide-up">
                    <img src="https://via.placeholder.com/400x250" alt="Product" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-lg font-semibold">T-Shirt</h3>
                    <p class="text-gray-600">$45.00</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        function searchProducts() {
            console.log('Searching products...');
        }
        function filterResults() {
            console.log('Filtering results...');
        }
    </script>

    <style>
        @keyframes slide-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s ease-in-out;
        }
    </style>
</body>
</html>
