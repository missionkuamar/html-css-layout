<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon Landing Page</title>
    <style>
       /* -------------------------
   Reset and Base Styles
------------------------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background-color: #1f2937;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  line-height: 1.6;
}

/* -------------------------
   Hero Section
------------------------- */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  animation: fadeInHero 1s ease-in-out;
}

.hero__title {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 15px;
}

.hero__subtitle {
  font-size: 1.2rem;
  max-width: 600px;
  margin: 0 auto 20px;
  color: #d1d5db;
}

/* -------------------------
   Countdown Timer
------------------------- */
.countdown {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
  flex-wrap: wrap;
}

.countdown__item {
  background: #374151;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
  min-width: 80px;
}

.countdown__value {
  font-size: 2rem;
  font-weight: 700;
}

.countdown__label {
  font-size: 0.9rem;
  color: #9ca3af;
}

/* -------------------------
   Signup Form
------------------------- */
.signup {
  max-width: 400px;
  margin: 0 auto;
  margin-top: 20px;
}

.signup__form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.signup__input {
  padding: 12px;
  flex: 1;
  font-size: 1rem;
  border-radius: 6px;
  border: none;
  outline: none;
}

.signup__button {
  background: #3b82f6;
  color: #fff;
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
}

.signup__button:hover {
  background: #2563eb;
  transform: scale(1.05);
}

/* -------------------------
   Social Links
------------------------- */
.social {
  margin-top: 30px;
}

.social__link {
  color: #ffffff;
  font-size: 1.5rem;
  margin: 0 12px;
  transition: color 0.3s ease;
}

.social__link:hover {
  color: #3b82f6;
}

/* -------------------------
   Footer
------------------------- */
.footer {
  background: #111827;
  padding: 20px;
  text-align: center;
}

.footer__text {
  font-size: 0.9rem;
  color: #9ca3af;
}

/* -------------------------
   Animations
------------------------- */
@keyframes fadeInHero {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* -------------------------
   Responsive Design
------------------------- */
@media (min-width: 768px) {
  .hero__title {
    font-size: 3.5rem;
  }

  .hero__subtitle {
    font-size: 1.5rem;
  }

  .countdown__item {
    min-width: 100px;
  }

  .countdown__value {
    font-size: 2.5rem;
  }
}

@media (max-width: 600px) {
  .hero__title {
    font-size: 2rem;
  }

  .hero__subtitle {
    font-size: 1rem;
  }

  .signup__form {
    flex-direction: column;
  }

  .signup__button {
    width: 100%;
  }
}

    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero__title">We're Coming Soon!</h1>
        <p class="hero__subtitle">Our website is under construction. Subscribe to get notified when we launch!</p>
        <div class="countdown">
            <div class="countdown__item">
                <div class="countdown__value">10</div>
                <div class="countdown__label">Days</div>
            </div>
            <div class="countdown__item">
                <div class="countdown__value">12</div>
                <div class="countdown__label">Hours</div>
            </div>
            <div class="countdown__item">
                <div class="countdown__value">45</div>
                <div class="countdown__label">Minutes</div>
            </div>
        </div>
        <div class="signup">
            <form class="signup__form">
                <input type="email" class="signup__input" placeholder="Enter your email" required>
                <button type="submit" class="signup__button">Subscribe</button>
            </form>
        </div>
        <div class="social">
            <a href="#" class="social__link">📘</a>
            <a href="#" class="social__link">🐦</a>
            <a href="#" class="social__link">📸</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer__text">© 2025 LaunchPad. All rights reserved.</p>
    </footer>
</body>
</html>
